[platformio]
build_dir = /tmp/pio-gateway-build
default_envs = m5stack-atoms3-usb
src_dir = src

[env]
platform = espressif32
board = m5stack-atoms3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time, log2file, colorize
board_build.f_cpu = 240000000L
board_build.partitions = partitions.csv
extra_scripts = post:scripts/post_build.py
lib_ldf_mode = deep+
build_unflags = -std=gnu++11 -std=gnu++14 -std=gnu++17
build_flags = 
    -std=gnu++2a
    -D CONFIG_ESP_COREDUMP_ENABLE_TO_FLASH=1
    -D CONFIG_ESP_COREDUMP_DATA_FORMAT_ELF=1
    -D CONFIG_ESP_IPC_TASK_STACK_SIZE=4096
    -D CONFIG_FREERTOS_HZ=1000
    -fstack-protector-all
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D WIFI_SSID='"Sweet_Home_2.4G"'
    -D WIFI_PASSWORD='"9dnjf1!DLF"'
    -D OTA_PASSWORD='"9dnjf1!DLF"'
    -D EMERGENCY_AP_PASS='"9dnjf1!DLF"'
    -D DEFAULT_TELNET_PASS='"9dnjf1!DLF"'

build_src_filter = +<main.cpp> +<Engine.cpp> +<TelnetCli.cpp> +<WallpadParser.cpp> +<CliCommands.cpp> +<MgmtRpc.cpp> +<ControlTemplate.cpp>
lib_deps = 
    plerup/EspSoftwareSerial @ ^8.2.0
    olmanqj/embedded-cli @ ^0.1.3
    WiFi
    Preferences
    ArduinoOTA
    HTTPClient
    Update
    WiFiClientSecure

[env:m5stack-atoms3-usb]
upload_protocol = esptool
upload_speed = 115200
upload_flags = 
    --before
    default_reset
    --after
    hard_reset

[env:m5stack-atoms3-ota]
upload_protocol = espota
upload_port = 172.30.1.3
upload_flags = 
    --auth="9dnjf1!DLF"