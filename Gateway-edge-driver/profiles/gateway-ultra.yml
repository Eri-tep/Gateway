name: gateway-ultra
components:
  - id: main
    label: "Devices"
    capabilities:
      - id: digituniverse06711.device
        version: 1
      - id: digituniverse06711.deviceManager
        version: 1
      - id: refresh
        version: 1
    categories:
      - name: Hub

  - id: wallpad
    label: "Wallpad"
    capabilities:
      - id: switch
        version: 1
      - id: digituniverse06711.profile
        version: 1
      - id: digituniverse06711.catalogMatch
        version: 1
      - id: digituniverse06711.blueprints
        version: 1
    categories:
      - name: Hub

  - id: diagnostics
    label: "Gateway"
    capabilities:
      - id: switch
        version: 1
      - id: digituniverse06711.uptime
        version: 1
      - id: digituniverse06711.resource
        version: 1
      - id: digituniverse06711.channel
        version: 1
    categories:
      - name: Hub

  - id: logs
    label: "Logs"
    capabilities:
      - id: switch
        version: 1
      - id: digituniverse06711.history
        version: 1
    categories:
      - name: Hub

  - id: network
    label: "Network"
    capabilities:
      - id: switch
        version: 1
      - id: digituniverse06711.scan
        version: 1
      - id: digituniverse06711.wifi
        version: 1
    categories:
      - name: Hub

  - id: ota
    label: "Firmware"
    capabilities:
      - id: switch
        version: 1
      - id: digituniverse06711.version
        version: 1
      - id: digituniverse06711.build
        version: 1
    categories:
      - name: Hub

preferences:
  # ==========================================
  # Group 1: Wi-Fi 관련 설정 (최상단)
  # ==========================================
  - preferenceId: wifiOperationMode
    name: wifiOperationMode
    title: "Wi-Fi Mode"
    description: "Operating Mode"
    required: true
    preferenceType: enumeration
    definition:
      options:
        "STA": "STA"
        "AP_STA": "AP_STA"
      default: "STA"

  - preferenceId: newWifiSsid
    name: newWifiSsid
    title: "Wi-Fi SSID"
    description: "Network Name"
    required: false
    preferenceType: string
    definition:
      stringType: text
      minLength: 0
      maxLength: 32
      default: ""

  - preferenceId: newWifiPassword
    name: newWifiPassword
    title: "Wi-Fi Password"
    description: "Network Password"
    required: false
    preferenceType: string
    definition:
      stringType: password
      minLength: 0
      maxLength: 64
      default: ""

  - preferenceId: applyWifiConfig
    name: applyWifiConfig
    title: "Wi-Fi Apply"
    description: "Apply Credentials"
    required: false
    preferenceType: boolean
    definition:
      default: false

  # ==========================================
  # Group 2: 게이트웨이 연동 IP / Port
  # ==========================================
  - preferenceId: gatewayIp
    name: gatewayIp
    title: "Gateway IP"
    description: "IPv4 Address"
    required: true
    preferenceType: string
    definition:
      stringType: text
      minLength: 7
      maxLength: 15
      default: "172.30.1.3"

  - preferenceId: gatewayPort
    name: gatewayPort
    title: "Gateway Port"
    description: "Management Port"
    required: true
    preferenceType: integer
    definition:
      minimum: 1024
      maximum: 65535
      default: 8900

  - preferenceId: pollingInterval
    name: pollingInterval
    title: "Gateway Interval"
    description: "Refresh Rate (sec)"
    required: true
    preferenceType: integer
    definition:
      minimum: 5
      maximum: 300
      default: 30

  # ==========================================
  # Group 3: Git 및 펌웨어 업데이트 경로
  # ==========================================
  - preferenceId: githubRepo
    name: githubRepo
    title: "GitHub Repository"
    description: "Owner/Repository"
    required: true
    preferenceType: string
    definition:
      stringType: text
      minLength: 3
      maxLength: 64
      default: "Eri-tep/Gateway"

  - preferenceId: otaChannel
    name: otaChannel
    title: "Release Channel"
    description: "Firmware Channel"
    required: true
    preferenceType: enumeration
    definition:
      options:
        "main": "Main"
        "beta": "Beta"
      default: "main"

  - preferenceId: wallpadProfileSlot
    name: wallpadProfileSlot
    title: "Wallpad Profile"
    description: "Protocol Slot"
    required: true
    preferenceType: enumeration
    definition:
      options:
        0: "Auto Detect"
        1: "Custom 1"
        2: "Custom 2"
        3: "Custom 3"
      default: 0

  - preferenceId: logLevel
    name: logLevel
    title: "Log Level"
    description: "Logcat Verbosity"
    required: false
    preferenceType: enumeration
    definition:
      options:
        "DEBUG": "DEBUG"
        "INFO": "INFO"
        "WARN": "WARN"
        "ERROR": "ERROR"
      default: "INFO"

  # ==========================================
  # Group 4: 채널별 주기 및 지연 설정
  # ==========================================
  - preferenceId: ch1PollInterval
    name: ch1PollInterval
    title: "CH1 Query Delay"
    description: "Polling Interval (ms)"
    required: true
    preferenceType: integer
    definition:
      minimum: 50
      maximum: 5000
      default: 1000

  - preferenceId: ch2AckDelay
    name: ch2AckDelay
    title: "CH2 Ack Delay"
    description: "Virtual ACK (ms)"
    required: true
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 500
      default: 30

  - preferenceId: ch3AckDelay
    name: ch3AckDelay
    title: "CH3 Ack Delay"
    description: "Virtual ACK (ms)"
    required: true
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 500
      default: 240

